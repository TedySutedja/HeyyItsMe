<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyyItsMe Audio Guestbook</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandCream: '#FDFBF7',
                        brandBlue: '#1E293B',
                        brandDark: '#121212',
                        brandAccent: '#059669',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-brandCream text-gray-800 antialiased selection:bg-brandAccent selection:text-white">

    <!-- Section A: Navigation -->
    <div id="section-a"></div>

    <!-- Section B: Home Hero -->
    <div id="section-b"></div>

    <!-- Section C: The Experience -->
    <div id="section-c"></div>

    <!-- Section D: How It Works -->
    <div id="section-d"></div>

    <!-- Section E: Collection Catalog -->
    <div id="section-e"></div>

    <!-- Section F: Secure Date & Custom Booking Form -->
    <div id="section-f"></div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Dynamic Section Loader Script -->
    <script>
        async function loadSection(containerId, filePath) {
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById(containerId).innerHTML = html;
                } else {
                    console.error('Gagal memuat: ' + filePath);
                }
            } catch (error) {
                console.error('Error jaringan:', error);
            }
        }

        // Memuat semua bagian secara modular (menggunakan huruf kecil/lowercase)
        loadSection('section-a', 'sections/a.html');
        loadSection('section-b', 'sections/b.html');
        loadSection('section-c', 'sections/c.html');
        loadSection('section-d', 'sections/d.html');
        loadSection('section-e', 'sections/e.html');
        loadSection('section-f', 'sections/f.html');
        loadSection('footer-container', 'sections/footer.html');
    </script>
</body>
</html>
