<!-- SECTION 5B: BOOKING FORM -->
<section class="py-12 bg-white relative">
    <div class="max-w-xl mx-auto px-6">
        <form class="bg-brandCream p-8 md:p-10 rounded-[2.5rem] shadow-xl border border-gray-100 space-y-4" onsubmit="event.preventDefault(); alert('Thank you! Your inquiry has been sent. We will get back to you shortly.');">
            <h3 class="font-serif text-2xl font-bold text-brandBlue mb-4">Availability Inquiry</h3>
            <div>
                <label class="block text-xs uppercase tracking-wider font-semibold text-gray-600 mb-1">Your Name</label>
                <input type="text" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brandBlue bg-white text-sm" placeholder="e.g. Riela & Partner">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider font-semibold text-gray-600 mb-1">Event Date</label>
                <input type="date" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brandBlue bg-white text-sm">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider font-semibold text-gray-600 mb-1">Preferred Telephone Model</label>
                <select class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brandBlue bg-white text-sm">
                    <option>Caecilia ($290)</option>
                    <option>Daphne ($290)</option>
                    <option>Duke ($320)</option>
                    <option>Marianne ($290)</option>
                    <option>The Chief ($290)</option>
                    <option>The Chrome ($320)</option>
                    <option>The Victorian ($320)</option>
                </select>
            </div>
            <button type="submit" class="w-full py-4 bg-brandBlue text-white font-medium rounded-xl shadow-lg hover:bg-brandBlue/90 transition text-sm tracking-wider uppercase">
                Check Availability & Book
            </button>
        </form>
    </div>
</section>
