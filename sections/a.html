<!-- NAVIGATION BAR -->
<header class="fixed top-0 left-0 right-0 z-50 bg-black/40 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <!-- Logo using assets/images/HIMt.png with white invert filter for white logo contrast -->
        <a href="#home" class="flex items-center gap-3">
            <img src="assets/images/HIMt.png" alt="HeyyItsMe Logo" class="h-10 md:h-12 w-auto object-contain brightness-0 invert" onerror="this.src='https://placehold.co/150x50/ffffff/ffffff?text=HeyyItsMe'">
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center space-x-6 text-sm font-medium tracking-wide text-white">
            <a href="#home" class="hover:text-emerald-300 transition">Home</a>
            <a href="#experience" class="hover:text-emerald-300 transition">The Experience</a>
            <a href="#how-it-works" class="hover:text-emerald-300 transition">How It Works</a>
            <a href="#collection" class="hover:text-emerald-300 transition">Collection</a>
            <a href="#booking" class="hover:text-emerald-300 transition">Secure Date</a>
        </nav>

        <div class="hidden md:flex items-center">
            <a href="#booking" class="px-5 py-2.5 rounded-full border border-white/30 text-white text-sm font-medium hover:bg-white hover:text-brandBlue transition duration-300">
                Check Availability
            </a>
        </div>

        <!-- Mobile Hamburger Button -->
        <button id="menu-btn" class="md:hidden p-2 rounded-xl text-white hover:bg-white/10 focus:outline-none" aria-label="Toggle Menu">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-brandDark border-b border-white/10 px-6 py-6 space-y-4 shadow-xl text-white">
        <a href="#home" class="block text-base font-medium hover:text-emerald-300 transition">Home</a>
        <a href="#experience" class="block text-base font-medium hover:text-emerald-300 transition">The Experience</a>
        <a href="#how-it-works" class="block text-base font-medium hover:text-emerald-300 transition">How It Works</a>
        <a href="#collection" class="block text-base font-medium hover:text-emerald-300 transition">Collection</a>
        <a href="#booking" class="block text-base font-medium hover:text-emerald-300 transition">Secure Date</a>
        <div class="pt-2">
            <a href="#booking" class="block w-full py-3 text-center rounded-full bg-emerald-400 text-brandDark text-sm font-medium">
                Check Availability
            </a>
        </div>
    </div>
</header>

<!-- Script khusus untuk interaksi Navigation (Mobile Menu Toggle) -->
<script>
    (function() {
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        if (menuBtn && mobileMenu) {
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
            
            mobileMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.add('hidden');
                });
            });
        }
    })();
</script>
